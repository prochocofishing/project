name: Build, validate and deploy static site

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: prochoco-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install prerender browser
        run: npx playwright install --with-deps chromium
      - name: Build and prerender PT/EN pages
        run: npm run build:static
      - name: Validate static pages, metadata and assets
        run: npm run test:static
      - name: Upload complete static site
        uses: actions/upload-artifact@v4
        with:
          name: prochoco-static
          path: dist/static
          include-hidden-files: true
      - name: Deploy to existing GitHub Pages hosting
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/static
          cname: www.prochoco.com
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
